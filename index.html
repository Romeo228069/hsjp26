<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSJP26">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>HSJP26</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--ink:#f5f5f7;--mute:#a1a1a6;--line:#2c2c31;--acc:#ff5a1f;--warn:#ff6961;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d9d9de;--warn:#c9342b;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.karte{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px 24px}
.marke{width:52px;height:52px;border-radius:14px;background:#0a0a0c;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.marke i{display:block;width:20px;height:20px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 7px rgba(255,90,31,.22)}
h1{font:700 28px/1.1 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.02em;margin:0 0 6px}
p{margin:0;color:var(--mute);font-size:15px}
form{margin-top:20px;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;min-height:48px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:600 17px -apple-system,sans-serif;color:#fff;background:var(--acc);border:0;border-radius:12px;padding:13px 14px;min-height:48px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#status{margin-top:14px;min-height:22px;font-size:15px}
#status.fehler{color:var(--warn)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="karte">
  <div class="marke" aria-hidden="true"><i></i></div>
  <h1>HSJP26</h1>
  <p id="hinweis">Diese Seite ist geschützt.</p>
  <form id="f" hidden autocomplete="on">
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <button id="los" type="submit">Öffnen</button>
  </form>
  <p id="status" role="status" aria-live="polite">Einen Moment …</p>
</main>
<script>
(function () {
  'use strict';
  var BASIS = new URL('./', location.href).pathname, LS = 'setplan.schluessel:' + BASIS, DATEN = 'setplan-daten-v1:' + BASIS, V = null;
  function $(i) { return document.getElementById(i); }
  function status(t, fehler) { var s = $('status'); if (s) { s.textContent = t || ''; s.className = fehler ? 'fehler' : ''; } }
  function formular(an) { var f = $('f'); if (!f) return; f.hidden = !an; $('los').disabled = false; if (an) { try { $('pw').focus(); } catch (e) {} } }
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(t) { var b = atob(t), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function norm(pw) { return String(pw || '').trim().toLowerCase().replace(/[\s_]+/g, '-'); }
  function merk(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function lies(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }

  async function holeVersion() {
    var r = await fetch('version.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('version');
    return r.json();
  }
  async function holePlan() {
    var c = null;
    try { if (window.caches) c = await caches.open(DATEN); } catch (e) { c = null; }
    if (c) {
      try { var t = await c.match(V.datei); if (t) return new Uint8Array(await t.arrayBuffer()); } catch (e) {}
    }
    var r = null;
    try { r = await fetch(V.datei, { cache: 'no-store' }); } catch (e) { r = null; }
    if (!r || !r.ok) {
      // Neue Fassung nicht ladbar: die zuletzt gespeicherte nehmen, statt das Gerät auszusperren
      if (c) { try { var alt = await c.keys(); if (alt.length) { var a = await c.match(alt[alt.length - 1]); if (a) return new Uint8Array(await a.arrayBuffer()); } } catch (e) {} }
      throw new Error('plan');
    }
    var kopie = c ? r.clone() : null;
    var buf = new Uint8Array(await r.arrayBuffer());
    if (c) {
      try {
        await c.put(V.datei, kopie);
        var ziel = new URL(V.datei, location.href).href, alle = await c.keys();
        await Promise.all(alle.filter(function (k) { return k.url !== ziel; }).map(function (k) { return c.delete(k); }));
      } catch (e) {}
    }
    return buf;
  }
  async function ableiten(pw) {
    var basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(V.salt), iterations: V.iter, hash: 'SHA-256' }, basis, 256);
    return new Uint8Array(bits);
  }
  async function entschluesseln(roh, buf) {
    var key = await crypto.subtle.importKey('raw', roh, { name: 'AES-GCM' }, false, ['decrypt']);
    var klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12));
    return new TextDecoder('utf-8').decode(klar);
  }
  function zeige(html) { document.open(); document.write(html); document.close(); }

  // Ergebnis: 'ok', 'falsch' (Schlüssel passt nicht) oder 'netz' (Plan nicht ladbar)
  async function oeffne(roh) {
    var buf;
    try { buf = await holePlan(); } catch (e) { return 'netz'; }
    var html;
    try { html = await entschluesseln(roh, buf); } catch (e) { return 'falsch'; }
    merk(LS, b64(roh));
    zeige(html);
    return 'ok';
  }

  async function start() {
    if (!window.crypto || !crypto.subtle) { status('Dieser Browser kann die Seite nicht öffnen. Bitte einen aktuellen Browser nehmen und die Adresse mit https aufrufen.', true); return; }
    try { V = await holeVersion(); } catch (e) { status('Kein Netz. Beim ersten Öffnen braucht die Seite einmal Internet.', true); return; }
    var gemerkt = lies(LS);
    if (gemerkt) {
      status('Plan wird geöffnet …');
      var roh = null;
      try { roh = unb64(gemerkt); } catch (e) { roh = null; }
      var erg = roh && roh.length === 32 ? await oeffne(roh) : 'falsch';
      if (erg === 'ok') return;
      if (erg === 'netz') { status('Kein Netz und der Plan ist auf diesem Gerät noch nicht gespeichert.', true); return; }
      merk(LS, null);
    }
    status('');
    formular(true);
  }

  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var pw = norm($('pw').value);
    if (!pw) return;
    $('los').disabled = true; status('Passwort wird geprüft …');
    var erg;
    try { erg = await oeffne(await ableiten(pw)); } catch (e) { erg = 'falsch'; }
    if (erg === 'ok') return;
    $('los').disabled = false;
    if (erg === 'netz') status('Der Plan konnte nicht geladen werden. Bitte Netz prüfen und noch einmal versuchen.', true);
    else { status('Das Passwort stimmt nicht.', true); try { $('pw').select(); } catch (e) {} }
  });

  start();
})();
</script>
</body>
</html>
